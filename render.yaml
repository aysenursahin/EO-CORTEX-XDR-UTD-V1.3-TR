# Render Blueprint: lab rehberinin web surumu (statik site)
# Render > New > Blueprint > bu repoyu secin > Apply.
# Adres https://eo-utd-workshop.onrender.com/ biciminde olur.
services:
  - type: web
    name: eo-utd-workshop
    runtime: static
    buildCommand: echo "Statik site, derleme gerekmiyor"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
